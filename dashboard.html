<html lang="en">
<head>

<title>Your saved searches · WantWatcher</title>
<meta name="description" content="Save the keywords you're hunting. WantWatcher watches eBay and Kijiji and alerts you when a match lands.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000; --ink: #ffffff; --mut: #8f8f8f; --dim: #3d3d3d;
      --neon: #00ff00; --neon-dim: #003b00; --org: #ff5c00;
      --line: #ffffff; --line2: #2b2b2b; --red: #ff2b2b;
      --font-d: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-m: "JetBrains Mono", "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; border-radius: 0 !important; }
    *, *::before, *::after { transition: none !important; }
    :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-m); font-size: 15px; line-height: 1.6; }
    ::selection { background: var(--neon); color: #000; }
    a { color: inherit; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    header.site { padding: 0; position: sticky; top: 0; z-index: 50; background: #000; border-bottom: 2px solid var(--line); }
    header.site .wrap { padding-top: 16px; padding-bottom: 16px; }
    header.site a.brand { font-family: var(--font-m); font-weight: 800; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
    header.site a.brand em { color: var(--neon); font-style: normal; }
    main { padding: 26px 0 80px; }
    .back { display: inline-block; margin: 6px 0 22px; color: var(--neon); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--line2); padding: 8px 14px; }
    .back:hover { background: var(--neon); color: #000; border-color: var(--neon); }
    .card { background: #000; border: 2px solid var(--line); padding: 30px 28px; box-shadow: 8px 8px 0 rgba(255,255,255,0.08); }
    .card + .card { margin-top: 24px; }
    h1 { margin: 0 0 12px; font-family: var(--font-d); font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.95; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    h2 { margin: 0 0 16px; font-family: var(--font-d); font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; font-size: 1.3rem; }
    .lede { color: var(--mut); margin: 0 0 6px; font-size: 0.92rem; }
    .eyebrow { display: inline-block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em; border: 1px solid var(--neon); padding: 6px 12px; margin: 0 0 16px; color: transparent; background-image: radial-gradient(circle, var(--neon) 1.1px, transparent 1.45px); background-size: 4.5px 4.5px; -webkit-background-clip: text; background-clip: text; }
    form.stack { display: grid; gap: 16px; margin-top: 20px; }
    form.stack label { display: grid; gap: 8px; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; }
    form.stack .opt { font-weight: 400; color: var(--mut); letter-spacing: 0.02em; text-transform: none; font-size: 0.82rem; }
    form.stack input[type="text"], form.stack input[type="email"], form.stack input[type="number"], form.stack select {
      padding: 13px 15px; border: 2px solid var(--line2); font-size: 0.95rem;
      background: #000; color: var(--ink); width: 100%; font-family: var(--font-m); }
    form.stack input:focus, form.stack select:focus { border-color: var(--neon); outline: none; color: var(--neon); }
    form.stack input::placeholder { color: var(--dim); }
    form.stack select option { background: #000; }
    .checks { display: flex; gap: 18px; flex-wrap: wrap; }
    .checks-wrap { border: 0; margin: 0; padding: 0; }
    .checks-wrap legend { font-weight: 800; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; padding: 0; margin-bottom: 8px; }
    .checks label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; letter-spacing: 0; text-transform: none; }
    .checks input { width: 1.1rem; height: 1.1rem; accent-color: var(--neon); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 520px) { .row-2 { grid-template-columns: 1fr; } }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 24px; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; font-family: var(--font-m); text-decoration: none; border: 2px solid var(--neon); background: var(--neon); color: #000; cursor: pointer; box-shadow: 5px 5px 0 var(--neon-dim); }
    .btn:hover { background: #000; color: var(--neon); box-shadow: 5px 5px 0 var(--neon); }
    .btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 var(--neon); }
    .btn:disabled { opacity: 0.5; cursor: wait; transform: none; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); box-shadow: none; }
    .btn-ghost:hover { background: var(--ink); color: #000; border-color: var(--ink); box-shadow: none; }
    .btn-danger { border: 2px solid var(--line2); color: var(--mut); background: transparent; padding: 8px 16px; font-size: 0.72rem; box-shadow: none; min-height: 44px; }
    .btn-danger:hover { border-color: var(--red); color: #000; background: var(--red); box-shadow: none; }
    .fine { color: var(--mut); font-size: 0.85rem; margin: 14px 0 0; }
    .fine a { color: var(--neon); font-weight: 700; }
    .notice { padding: 14px 18px; margin-top: 16px; font-size: 0.88rem; border: 2px solid var(--line2); }
    .notice.info { border-color: var(--neon); color: var(--neon); }
    .notice.error { border-color: var(--red); color: var(--red); }
    .who { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; border: 1px solid var(--line2); padding: 12px 16px; }
    .who .email { font-weight: 700; overflow-wrap: anywhere; font-size: 0.9rem; }
    .search-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--line2); }
    .search-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--line2); background: #000; }
    .search-item:last-child { border-bottom: 0; }
    .search-item:hover { background: #0a0a0a; }
    .search-item .kw { font-weight: 800; margin: 0 0 4px; overflow-wrap: anywhere; font-size: 0.95rem; }
    .search-item .meta { color: var(--mut); font-size: 0.78rem; margin: 0; text-transform: uppercase; letter-spacing: 0.06em; }
    .search-item .row-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
    .search-item.is-paused { opacity: 0.55; }
    .paused-tag { display: inline-block; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: #000; background: var(--org); padding: 3px 9px; margin-left: 8px; vertical-align: middle; }
    .empty { text-align: center; color: var(--mut); padding: 30px 14px; border: 2px dashed var(--dim); }
    .empty p { margin: 0 0 6px; font-size: 0.88rem; }
    .empty strong { color: var(--ink); }
    .loading { text-align: center; color: var(--neon); padding: 70px 20px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.85rem; }
    footer { border-top: 2px solid var(--line); padding: 26px 0 40px; color: var(--mut); font-size: 0.8rem; background: #000; }
    footer a { color: var(--neon); font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>

</head>
<body>
  <header class="site"><div class="wrap"><a class="brand" href="/">Want<em>Watcher</em></a></div></header>
  <main><div class="wrap" id="app">
    <a class="back" href="/">&larr; Home</a>
    <p class="loading">Loading your dashboard…</p>
  </div></main>
  <footer><div class="wrap">WantWatcher — collector alerts for better finds, not more noise. Saved searches are private to your account. <a href="/">Back to the live feed</a> · <a href="/dashboard.html">Dashboard</a>.</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase/config.js"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var cfg = (typeof window.WANTWATCHER_SUPABASE === "object" && window.WANTWATCHER_SUPABASE) || {};
  var CONFIGURED = typeof cfg.url === "string" && cfg.url.indexOf("YOUR-PROJECT-REF") === -1 &&
                   typeof cfg.anonKey === "string" && cfg.anonKey.indexOf("YOUR-SUPABASE") === -1;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) {
    if (n == null || n === "") return null;
    try { return new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD" }).format(n); }
    catch (e) { return "C$" + n; }
  }
  function notice(kind, text) {
    return '<div class="notice ' + kind + '" role="status">' + esc(text) + "</div>";
  }

  /* -- State 1: Supabase not wired up yet. Friendly panel, no console errors. -- */
  function renderNotConfigured() {
    app.innerHTML =
      '<a class="back" href="/">&larr; Home</a>' +
      '<div class="card"><p class="eyebrow">Saved searches</p>' +
      "<h1>Keyword alerts are almost here.</h1>" +
      '<p class="lede">Soon you\'ll save the exact keywords you\'re hunting — model numbers, niches, max prices — and we\'ll watch eBay and Kijiji for matches.</p>' +
      '<p class="fine">Meanwhile, the <a href="/#live-finds">free live feed</a> is already running.</p></div>';
  }

  /* -- State 2: signed-out sign-in form (magic link, no password). -- */
  function renderSignIn(msg) {
    app.innerHTML =
      '<a class="back" href="/">&larr; Home</a>' +
      '<div class="card"><p class="eyebrow">Saved searches</p>' +
      "<h1>Sign in to save your hunts.</h1>" +
      '<p class="lede">No password — we email you a one-time sign-in link. Your saved searches stay private to your account.</p>' +
      (msg ? notice(msg.kind, msg.text) : "") +
      '<form class="stack" id="signin-form">' +
      '<label>Email<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label>' +
      '<div><button class="btn btn-teal" type="submit">Email me a sign-in link</button></div>' +
      "</form></div>";

    document.getElementById("signin-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var email = ev.target.email.value.trim();
      if (!email) return;
      var btn = ev.target.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Sending…";
      client.auth.signInWithOtp({
        email: email,
        options: { emailRedirectTo: window.location.origin + "/dashboard.html" }
      }).then(function (res) {
        if (res.error) throw res.error;
        renderSignIn({ kind: "info", text: "Check your inbox — we sent a sign-in link to " + email + "." });
      }).catch(function () {
        renderSignIn({ kind: "error", text: "Couldn't send the link. Double-check the address and try again." });
      });
    });
  }

  /* -- State 3: signed-in dashboard. -- */
  function searchItemHtml(s) {
    var parts = [s.niche || "vintage-tech"];
    parts.push(s.max_price_cad != null ? "up to " + money(s.max_price_cad) : "no price cap");
    parts.push(((s.marketplaces && s.marketplaces.length) ? s.marketplaces : ["ebay", "kijiji"]).join(" · "));
    var paused = s.enabled === false;
    return '<li class="search-item' + (paused ? " is-paused" : "") + '" data-id="' + esc(s.id) + '">' +
      '<div><p class="kw">' + esc(s.keywords) + (paused ? ' <span class="paused-tag">paused</span>' : "") + '</p><p class="meta">' + esc(parts.join(" · ")) + "</p></div>" +
      '<div class="row-actions">' +
      '<button class="btn btn-ghost" data-toggle="' + esc(s.id) + '" data-enabled="' + (paused ? "false" : "true") + '">' + (paused ? "Resume" : "Pause") + "</button>" +
      '<button class="btn btn-danger" data-delete="' + esc(s.id) + '">Delete</button></div></li>';
  }

  function renderDashboard(user, searches, msg) {
    var listHtml = searches.length
      ? '<ul class="search-list">' + searches.map(searchItemHtml).join("") + "</ul>"
      : '<div class="empty"><p><strong>No saved searches yet.</strong></p><p>Add your first hunt below — e.g. “iPod Classic 160GB thin”.</p></div>';

    app.innerHTML =
      '<a class="back" href="/">&larr; Home</a>' +
      '<div class="who"><span class="email">' + esc(user.email || "Signed in") + '</span>' +
      '<button class="btn btn-ghost" id="signout">Sign out</button></div>' +
      '<div class="card"><h2>Your saved searches</h2>' + listHtml +
      (msg ? notice(msg.kind, msg.text) : "") + "</div>" +
      '<div class="card"><h2>Add a hunt</h2>' +
      '<p class="lede">We watch eBay and Kijiji for new listings matching these keywords.</p>' +
      '<form class="stack" id="add-form">' +
      '<label>Keywords <span class="opt">— be specific: model numbers beat vague terms</span>' +
      '<input type="text" name="keywords" required maxlength="200" placeholder="e.g. iPod Classic 160GB thin" autocomplete="off"></label>' +
      '<div class="row-2">' +
      '<label>Niche<select name="niche"><option value="vintage-tech">Vintage tech</option>' +
      '<option value="retro-gaming">Retro gaming</option><option value="other">Other</option></select></label>' +
      '<label>Max price (CAD) <span class="opt">(optional)</span>' +
      '<input type="number" name="max_price" min="1" step="0.01" placeholder="e.g. 200" inputmode="decimal"></label>' +
      "</div>" +
      '<fieldset class="checks-wrap"><legend>Marketplaces</legend><div class="checks">' +
      '<label><input type="checkbox" name="mp_ebay" checked> eBay</label>' +
      '<label><input type="checkbox" name="mp_kijiji" checked> Kijiji</label>' +
      "</div></fieldset>" +
      '<div><button class="btn btn-primary" type="submit">Save this search</button></div>' +
      "</form>" +
      '<p class="fine">Email alerts go live next — saving searches now puts you first in line.</p></div>';

    document.getElementById("signout").addEventListener("click", function () {
      client.auth.signOut().then(function () { renderSignIn(null); });
    });

    document.getElementById("add-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var f = ev.target;
      var keywords = f.keywords.value.trim();
      if (!keywords) return;
      var mps = [];
      if (f.mp_ebay.checked) mps.push("ebay");
      if (f.mp_kijiji.checked) mps.push("kijiji");
      if (!mps.length) mps = ["ebay", "kijiji"];
      var maxPrice = f.max_price.value === "" ? null : Number(f.max_price.value);
      var btn = f.querySelector("button");
      btn.disabled = true;
      client.from("saved_searches").insert({
        user_id: user.id,
        keywords: keywords,
        niche: f.niche.value,
        max_price_cad: maxPrice,
        marketplaces: mps
      }).then(function (res) {
        if (res.error) throw res.error;
        loadDashboard(user);
      }).catch(function () {
        renderDashboard(user, searches, { kind: "error", text: "Couldn't save that search — try again." });
      });
    });

    app.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-toggle");
        var next = btn.getAttribute("data-enabled") !== "true";
        btn.disabled = true;
        client.from("saved_searches").update({ enabled: next }).eq("id", id).eq("user_id", user.id)
          .then(function (res) {
            if (res.error) throw res.error;
            loadDashboard(user);
          }).catch(function () {
            renderDashboard(user, searches, { kind: "error", text: "Couldn't update that search — try again." });
          });
      });
    });

    app.querySelectorAll("[data-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-delete");
        var row = btn.closest(".search-item");
        var label = row ? row.querySelector(".kw").textContent : "this search";
        if (!window.confirm('Delete "' + label + '"?')) return;
        btn.disabled = true;
        client.from("saved_searches").delete().eq("id", id).eq("user_id", user.id)
          .then(function (res) {
            if (res.error) throw res.error;
            loadDashboard(user);
          }).catch(function () {
            renderDashboard(user, searches, { kind: "error", text: "Couldn't delete that search — try again." });
          });
      });
    });
  }

  function loadDashboard(user) {
    client.from("saved_searches")
      .select("id, keywords, niche, max_price_cad, marketplaces, enabled, created_at")
      .eq("user_id", user.id)
      .order("created_at", { ascending: false })
      .then(function (res) {
        if (res.error) throw res.error;
        renderDashboard(user, res.data || [], null);
      })
      .catch(function () {
        renderDashboard(user, [], { kind: "error", text: "Couldn't load your searches — try refreshing." });
      });
  }

  /* -- Boot. -- */
  if (!CONFIGURED) { renderNotConfigured(); return; }
  if (typeof window.supabase === "undefined" || typeof window.supabase.createClient !== "function") {
    app.innerHTML = '<a class="back" href="/">&larr; Home</a>' +
      '<div class="card"><p class="eyebrow">Saved searches</p><h1>Dashboard unavailable right now.</h1>' +
      '<p class="lede">A script failed to load — check your connection and refresh.</p></div>';
    return;
  }

  var client;
  try {
    client = window.supabase.createClient(cfg.url, cfg.anonKey);
  } catch (e) {
    renderNotConfigured();
    return;
  }

  // Magic-link return: Supabase puts tokens in the URL hash; the client
  // parses them automatically. Show a signing-in state meanwhile.
  var inHash = false;
  try { inHash = window.location.hash.indexOf("access_token=") !== -1; } catch (e) {}
  if (inHash) {
    app.innerHTML = '<p class="loading">Signing you in…</p>';
  }

  client.auth.onAuthStateChange(function (event, session) {
    if (event === "SIGNED_IN" && session && session.user) {
      try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
      loadDashboard(session.user);
    } else if (event === "SIGNED_OUT") {
      renderSignIn(null);
    }
  });

  client.auth.getSession().then(function (res) {
    if (res.error) throw res.error;
    if (res.data && res.data.session && res.data.session.user) {
      loadDashboard(res.data.session.user);
    } else if (!inHash) {
      renderSignIn(null);
    }
    // If inHash but no session yet, onAuthStateChange will fire shortly.
  }).catch(function () {
    renderSignIn({ kind: "error", text: "Couldn't reach the sign-in service — check your connection and try again." });
  });

  // Safety net: if a magic-link hash never resolves into a session, don't
  // leave the user staring at "Signing you in…" forever.
  setTimeout(function () {
    if (inHash && app.querySelector(".loading")) {
      try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
      renderSignIn({ kind: "error", text: "That sign-in link didn't work — request a fresh one below." });
    }
  }, 15000);
})();
</script>
</body>
</html>
