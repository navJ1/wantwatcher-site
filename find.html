<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1F3A'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19.5 19.5L27 27' stroke='%23C6A15B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="canonical" href="https://wantwatcher.com/find.html" />

<meta property="og:site_name" content="WantWatcher" />
<meta property="og:url" content="https://wantwatcher.com/find.html" />
<meta property="og:title" content="Why this is a good deal · WantWatcher" />
<meta property="og:description" content="The watcher's evidence for a verified marketplace find: model checks, price math, and what to confirm before you buy." />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Why this is a good deal · WantWatcher" />
<meta name="twitter:description" content="The evidence behind a verified collector find — model checks, price math, before-you-buy checklist." />
<title>Find detail · WantWatcher</title>
<meta name="description" content="Why the watcher flagged this marketplace find — the evidence, the price math, and what to check before you buy.">
<style>
  :root {
    color-scheme: dark;
    --bg: #0B1F3A; --bg-deep: #081627;
    --surface: #10294F; --surface-2: #14315C;
    --char: #14171C; --char-2: #1C212B;
    --ink: #F3F6FC; --muted: #A9B7D0; --faint: #7E8CA6;
    --line: rgba(148, 178, 226, .14); --line-strong: rgba(148, 178, 226, .30);
    --gold: #C6A15B; --gold-bright: #DDBB7E; --gold-ink: #221806;
    --gold-soft: rgba(198, 161, 91, .12);
    --blue: #5B8DEF;
    --verified: #1F9D55; --verified-ink: #04160C;
    --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;
    --shadow: 0 24px 60px rgba(2, 8, 20, .45);
    --font-display: "Space Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  ::selection { background: rgba(198, 161, 91, .35); }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  h1, h2 { font-family: var(--font-display); letter-spacing: -.02em; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header.site { padding: 0; position: sticky; top: 0; z-index: 60;
    background: rgba(11, 31, 58, .78);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line); }
  header.site .wrap { display: flex; align-items: center; min-height: 68px; }
  header.site a.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px;
    font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
    color: var(--ink); text-decoration: none; }
  header.site a.brand em { color: var(--gold); font-style: normal; }
  .brand-mark { width: 30px; height: 30px; flex: 0 0 30px; }
  main { padding: 10px 0 80px; }
  .back { display: inline-flex; align-items: center; min-height: 44px; margin: 6px 0 22px; color: var(--gold-bright); font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); }
  .card img.hero { width: 100%; max-height: 380px; object-fit: cover; display: block; background: var(--bg-deep); }
  .card-body { padding: 30px; }
  /* Green is reserved exclusively for the Verified badge. */
  .badge { display: inline-block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 6px 13px; border-radius: 999px; margin-bottom: 14px; }
  .badge.verified { background: var(--verified); color: var(--verified-ink); }
  .badge.price_alert { color: var(--gold-bright); border: 1px solid rgba(198, 161, 91, .55); background: var(--gold-soft); }
  h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.25; }
  .price-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 8px 0 6px; }
  .price { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; letter-spacing: -.01em; }
  .meta { color: var(--faint); font-size: 0.92rem; margin: 0 0 4px; }
  .why { margin: 26px 0 0; padding: 22px 24px; background: var(--surface-2); border: 1px solid var(--line);
    border-left: 3px solid var(--gold); border-radius: var(--radius-md); }
  .why h2, .caveats h2 { margin: 0 0 10px; font-size: 1.05rem; }
  .why ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
  .why li::marker { content: "✓ "; color: var(--gold); font-weight: 800; }
  .why p { margin: 0; color: var(--muted); }
  .caveats { margin: 18px 0 0; padding: 22px 24px; background: var(--char-2); border: 1px solid var(--line); border-radius: var(--radius-md); }
  .caveats ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--muted); font-size: 0.95rem; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px;
    padding: 0 26px; border-radius: 999px; font-weight: 700; text-decoration: none;
    transition: background .15s ease, border-color .15s ease; }
  .btn-primary { background: var(--gold); color: var(--gold-ink); box-shadow: 0 8px 24px rgba(198, 161, 91, .22); }
  .btn-primary:hover { background: var(--gold-bright); }
  .btn-ghost { border: 1px solid var(--line-strong); color: var(--ink); background: rgba(255,255,255,.03); }
  .btn-ghost:hover { border-color: var(--gold); }
  .loading, .missing { text-align: center; color: var(--muted); padding: 70px 20px; }
  .missing h1 { margin-bottom: 8px; }
  .missing .btn { margin-top: 6px; }
  footer { background: var(--char); border-top: 1px solid var(--line); padding: 26px 0 40px; color: var(--faint); font-size: 0.9rem; }
  footer a { color: var(--gold-bright); }
</style>
</head>
<body>
  <header class="site"><div class="wrap"><a class="brand" href="/" aria-label="WantWatcher home"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#10294F"/><circle cx="14" cy="14" r="7" fill="none" stroke="#C6A15B" stroke-width="3"/><path d="M19.5 19.5L27 27" stroke="#C6A15B" stroke-width="3" stroke-linecap="round"/><circle cx="14" cy="14" r="2.6" fill="#5B8DEF"/></svg><span>Want<em>Watcher</em></span></a></div></header>
  <main><div class="wrap" id="app">
    <p class="loading">Loading the find…</p>
  </div></main>
  <footer><div class="wrap">WantWatcher — collector alerts for better finds, not more noise. Verification means the model ID appeared in the listing and the price checked out — photos are not inspected automatically. Always confirm the details with the seller before paying.</div></footer>

<script>
(function () {
  "use strict";
  var FEED_URL = "https://raw.githubusercontent.com/navJ1/wantwatcher-feed/main/feed.json";
  var app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    var h = Math.round(m / 60);
    if (h < 48) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }
  function money(item) {
    try {
      return new Intl.NumberFormat("en-CA", { style: "currency", currency: item.currency || "CAD" }).format(item.price);
    } catch (e) { return "$" + item.price; }
  }
  function loadError() {
    app.innerHTML =
      '<a class="back" href="/#live-finds">&larr; All finds</a>' +
      '<div class="missing"><h1>Couldn\'t load this find.</h1>' +
      "<p>Check your connection and try again — the feed may be temporarily unreachable.</p>" +
      '<p><a class="btn btn-ghost" href="/#live-finds">See live finds</a></p></div>';
  }
  function missing() {
    app.innerHTML =
      '<a class="back" href="/#live-finds">&larr; All finds</a>' +
      '<div class="missing"><h1>This find has moved on.</h1>' +
      "<p>It may have sold, expired, or aged out of the feed. The watcher posts new finds as they verify.</p>" +
      '<p><a class="btn btn-ghost" href="/#live-finds">See live finds</a></p></div>';
  }

  var id = null;
  try { id = new URLSearchParams(window.location.search).get("id"); } catch (e) {}
  if (!id) { missing(); return; }

  fetch(FEED_URL + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("feed " + r.status); return r.json(); })
    .then(function (data) {
      var items = (data && data.items) || [];
      var item = null;
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].id) === String(id)) { item = items[i]; break; }
      }
      if (!item) { missing(); return; }

      var badge = item.badge === "verified"
        ? '<span class="badge verified">Verified find</span>'
        : '<span class="badge price_alert">Price alert</span>';
      var img = item.image
        ? '<img class="hero" src="' + esc(item.image) + '" alt="' + esc(item.title) + '" loading="eager" onerror="this.remove()">'
        : "";
      var why = item.why || [];
      var whyHtml = why.length
        ? "<ul>" + why.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul>"
        : "<p>Flagged from the listing title and price only. Confirm the model with the seller and check shipping before buying.</p>";

      app.innerHTML =
        '<a class="back" href="/#live-finds">&larr; All finds</a>' +
        '<article class="card">' + img + '<div class="card-body">' +
        badge +
        "<h1>" + esc(item.title) + "</h1>" +
        '<div class="price-row"><span class="price">' + esc(money(item)) + "</span></div>" +
        '<p class="meta">' + esc(item.niche || "") + " · " + esc(item.marketplace || "") +
        (item.detected_at ? " · found " + esc(ago(item.detected_at)) : "") + "</p>" +
        '<div class="why"><h2>Why the watcher flagged it</h2>' + whyHtml + "</div>" +
        '<div class="caveats"><h2>Before you buy</h2><ul>' +
        "<li>Confirm the model and revision with the seller — titles can be wrong.</li>" +
        "<li>Ask for photos of serials, labels and the actual item working, if not shown.</li>" +
        "<li>Factor in shipping, taxes and any import fees before comparing prices.</li>" +
        "</ul></div>" +
        '<div class="actions">' +
        '<a class="btn btn-primary" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">View listing</a>' +
        '<a class="btn btn-ghost" href="/#live-finds">More finds</a>' +
        "</div></div></article>";
    })
    .catch(function () { loadError(); });
})();
</script>
</body>
</html>
