<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:description" content="The watcher's evidence for a verified marketplace find: model checks, price math, and what to confirm before you buy." />
<meta name="twitter:card" content="summary" />

<title>Find detail · WantWatcher</title>
<meta name="description" content="Why the watcher flagged this marketplace find — the evidence, the price math, and what to check before you buy.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000; --ink: #ffffff; --mut: #8f8f8f; --dim: #3d3d3d;
      --neon: #00ff00; --org: #ff5c00;
      --line: #ffffff; --line2: #2b2b2b;
      --font-d: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-m: "JetBrains Mono", "Courier New", Courier, monospace;
    }
    * { box-sizing: border-box; border-radius: 0 !important; }
    *, *::before, *::after { transition: none !important; }
    :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-m); font-size: 15px; line-height: 1.6; }
    ::selection { background: var(--neon); color: #000; }
    a { color: inherit; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    header.site { padding: 0; position: sticky; top: 0; z-index: 50; background: #000; border-bottom: 2px solid var(--line); }
    header.site .wrap { padding-top: 16px; padding-bottom: 16px; }
    header.site a.brand { font-family: var(--font-m); font-weight: 800; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
    header.site a.brand em { color: var(--neon); font-style: normal; }
    main { padding: 26px 0 80px; }
    .back { display: inline-block; margin: 6px 0 22px; color: var(--neon); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--line2); padding: 8px 14px; }
    .back:hover { background: var(--neon); color: #000; border-color: var(--neon); }
    .card { background: #000; border: 2px solid var(--line); box-shadow: 8px 8px 0 rgba(255,255,255,0.08); }
    .card img.hero { width: 100%; max-height: 380px; object-fit: cover; display: block; background: #0a0a0a; filter: grayscale(1) contrast(1.25); border-bottom: 2px solid var(--line); }
    .card-body { padding: 30px 28px; }
    .badge { display: inline-block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; padding: 6px 12px; margin-bottom: 16px; border: 1px solid var(--neon); color: var(--neon); }
    .badge.price_alert { border-color: var(--org); color: var(--org); }
    h1 { margin: 0 0 12px; font-family: var(--font-m); font-weight: 800; font-size: 1.5rem; line-height: 1.3; text-transform: none; letter-spacing: 0; }
    .price-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 8px 0 6px; }
    .price { font-family: var(--font-m); font-size: 2.6rem; font-weight: 800; color: var(--neon); letter-spacing: -0.02em; }
    .meta { color: var(--mut); font-size: 0.78rem; margin: 0 0 4px; text-transform: uppercase; letter-spacing: 0.08em; }
    .why { margin: 26px 0 0; padding: 22px; background: #000; border: 2px solid var(--neon); }
    .why h2, .caveats h2 { margin: 0 0 12px; font-family: var(--font-m); font-weight: 800; font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; }
    .why h2 { color: var(--neon); }
    .why ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 0.9rem; }
    .why li::before { content: "[OK] "; color: var(--neon); font-weight: 800; }
    .why p { margin: 0; font-size: 0.9rem; color: var(--mut); }
    .caveats { margin: 18px 0 0; padding: 22px; border: 2px solid var(--org); }
    .caveats h2 { color: var(--org); }
    .caveats ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--mut); font-size: 0.88rem; }
    .caveats li::before { content: "[!] "; color: var(--org); font-weight: 800; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 26px; font-family: var(--font-m); font-weight: 800; font-size: 0.82rem; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; border: 2px solid var(--neon); background: var(--neon); color: #000; box-shadow: 5px 5px 0 #003b00; }
    .btn:hover { background: #000; color: var(--neon); box-shadow: 5px 5px 0 var(--neon); }
    .btn:active { transform: translate(5px, 5px); box-shadow: none; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); box-shadow: none; }
    .btn-ghost:hover { background: var(--ink); color: #000; border-color: var(--ink); box-shadow: none; }
    .loading, .missing { text-align: center; color: var(--mut); padding: 70px 20px; }
    .missing h1 { margin-bottom: 10px; }
    .missing p a:not(.btn) { color: var(--neon); font-weight: 700; }
    .missing p { margin: 0 0 10px; }
    footer { border-top: 2px solid var(--line); padding: 26px 0 40px; color: var(--mut); font-size: 0.8rem; background: #000; }
    footer a { color: var(--neon); font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>

</head>
<body>
  <header class="site"><div class="wrap"><a class="brand" href="/">Want<em>Watcher</em></a></div></header>
  <main><div class="wrap" id="app">
    <p class="loading">Loading the find…</p>
  </div></main>
  <footer><div class="wrap">WantWatcher — collector alerts for better finds, not more noise. Verification means the model ID appeared in the listing and the price checked out — photos are not inspected automatically. Always confirm the details with the seller before paying.</div></footer>

<script>
(function () {
  "use strict";
  var FEED_URL = "https://raw.githubusercontent.com/navJ1/wantwatcher-feed/main/feed.json";
  var app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    var h = Math.round(m / 60);
    if (h < 48) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }
  function money(item) {
    try {
      return new Intl.NumberFormat("en-CA", { style: "currency", currency: item.currency || "CAD" }).format(item.price);
    } catch (e) { return "$" + item.price; }
  }
  function loadError() {
    app.innerHTML =
      '<a class="back" href="/#live-finds">&larr; All finds</a>' +
      '<div class="missing"><h1>Couldn\'t load this find.</h1>' +
      "<p>Check your connection and try again — the feed may be temporarily unreachable.</p>" +
      '<p><a class="btn btn-ghost" href="/#live-finds">See live finds</a></p></div>';
  }
  function missing() {
    app.innerHTML =
      '<a class="back" href="/#live-finds">&larr; All finds</a>' +
      '<div class="missing"><h1>This find has moved on.</h1>' +
      "<p>It may have sold, expired, or aged out of the feed. The watcher posts new finds as they verify.</p>" +
      '<p><a class="btn btn-ghost" href="/#live-finds">See live finds</a></p></div>';
  }

  var id = null;
  try { id = new URLSearchParams(window.location.search).get("id"); } catch (e) {}
  if (!id) { missing(); return; }

  fetch(FEED_URL + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("feed " + r.status); return r.json(); })
    .then(function (data) {
      var items = (data && data.items) || [];
      var item = null;
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].id) === String(id)) { item = items[i]; break; }
      }
      if (!item) { missing(); return; }

      var badge = item.badge === "verified"
        ? '<span class="badge verified">Verified find</span>'
        : '<span class="badge price_alert">Price alert</span>';
      var img = item.image
        ? '<img class="hero" src="' + esc(item.image) + '" alt="' + esc(item.title) + '" loading="eager" onerror="this.remove()">'
        : "";
      var why = item.why || [];
      var whyHtml = why.length
        ? "<ul>" + why.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul>"
        : "<p>Flagged from the listing title and price only. Confirm the model with the seller and check shipping before buying.</p>";

      app.innerHTML =
        '<a class="back" href="/#live-finds">&larr; All finds</a>' +
        '<article class="card">' + img + '<div class="card-body">' +
        badge +
        "<h1>" + esc(item.title) + "</h1>" +
        '<div class="price-row"><span class="price">' + esc(money(item)) + "</span></div>" +
        '<p class="meta">' + esc(item.niche || "") + " · " + esc(item.marketplace || "") +
        (item.detected_at ? " · found " + esc(ago(item.detected_at)) : "") + "</p>" +
        '<div class="why"><h2>Why the watcher flagged it</h2>' + whyHtml + "</div>" +
        '<div class="caveats"><h2>Before you buy</h2><ul>' +
        "<li>Confirm the model and revision with the seller — titles can be wrong.</li>" +
        "<li>Ask for photos of serials, labels and the actual item working, if not shown.</li>" +
        "<li>Factor in shipping, taxes and any import fees before comparing prices.</li>" +
        "</ul></div>" +
        '<div class="actions">' +
        '<a class="btn btn-primary" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">View listing</a>' +
        '<a class="btn btn-ghost" href="/#live-finds">More finds</a>' +
        "</div></div></article>";
    })
    .catch(function () { loadError(); });
})();
</script>
</body>
</html>
