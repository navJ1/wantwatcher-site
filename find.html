<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:url" content="https://wantwatcher.com/find.html" />
<meta property="og:title" content="Why this is a good deal · WantWatcher" />
<meta property="og:description" content="The watcher's evidence for a verified marketplace find: model checks, price math, and what to confirm before you buy." />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Why this is a good deal · WantWatcher" />
<meta name="twitter:description" content="The evidence behind a verified collector find — model checks, price math, before-you-buy checklist." />
<title>Find detail · WantWatcher</title>
<meta name="description" content="Why the watcher flagged this marketplace find — the evidence, the price math, and what to check before you buy.">
<style>
  :root {
    color-scheme: dark;
    --bg: #090a0f; --bg-2: #0c0e15; --solid: #10141c; --solid-2: #151b26;
    --ink: #f5f7fb; --muted: #9aa4b5; --faint: #697384;
    --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
    --green: #35d07f; --green-dim: rgba(53,208,127,.12);
    --gold: #d9b36c; --gold-2: #f0d49a; --gold-dim: rgba(217,179,108,.12);
    --shadow: 0 24px 70px rgba(0,0,0,.55);
    --r-lg: 22px; --r-md: 16px;
    --font-d: "Space Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-b: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-b); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header.site { padding: 18px 0; position: sticky; top: 0; z-index: 50; background: rgba(9,10,15,.78); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  header.site a.brand { font-family: var(--font-d); font-weight: 700; font-size: 1.12rem; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
  header.site a.brand em { color: var(--gold); font-style: normal; }
  main { padding: 26px 0 80px; }
  .back { display: inline-block; margin: 6px 0 22px; color: var(--gold-2); font-weight: 600; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .card { background: var(--solid); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
  .card img.hero { width: 100%; max-height: 380px; object-fit: cover; display: block; background: var(--bg-2); }
  .card-body { padding: 28px; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; padding: 5px 12px; border-radius: 999px; margin-bottom: 12px; }
  .badge.verified { color: var(--green); border: 1px solid rgba(53,208,127,.5); background: var(--green-dim); box-shadow: 0 0 16px rgba(53,208,127,.12); }
  .badge.price_alert { color: var(--gold-2); border: 1px solid rgba(217,179,108,.5); background: var(--gold-dim); }
  h1 { margin: 0 0 10px; font-family: var(--font-d); font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.2; letter-spacing: -.025em; }
  .price-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 6px 0 4px; }
  .price { font-family: var(--font-d); font-size: 2.1rem; font-weight: 700; letter-spacing: -.02em; }
  .meta { color: var(--muted); font-size: .92rem; margin: 0 0 4px; }
  .why { margin: 26px 0 0; padding: 20px 22px; background: var(--green-dim); border: 1px solid rgba(53,208,127,.25); border-radius: var(--r-md); }
  .why h2, .caveats h2 { margin: 0 0 10px; font-family: var(--font-d); font-size: 1.05rem; letter-spacing: -.01em; }
  .why ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
  .why li::marker { content: "✓ "; color: var(--green); font-weight: 800; }
  .caveats { margin: 18px 0 0; padding: 20px 22px; background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: var(--r-md); }
  .caveats ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--muted); font-size: .95rem; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 12px 26px; border-radius: 12px; font-weight: 700; text-decoration: none; border: 1px solid transparent; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .btn-primary { background: linear-gradient(180deg, #1a2030, #121724); color: var(--ink); border-color: rgba(217,179,108,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 8px 24px rgba(0,0,0,.45); }
  .btn-primary:hover { transform: translateY(-1px); border-color: var(--gold-2); }
  .btn-ghost { border-color: var(--line-2); color: var(--ink); background: rgba(255,255,255,.03); }
  .btn-ghost:hover { border-color: var(--gold); background: var(--gold-dim); }
  .loading, .missing { text-align: center; color: var(--muted); padding: 70px 20px; }
  .missing h1 { margin-bottom: 8px; }
  .missing p a:not(.btn) { color: var(--gold-2); }
  footer { border-top: 1px solid var(--line); padding: 26px 0 40px; color: var(--muted); font-size: .9rem; background: #07080c; }
  footer a { color: var(--gold-2); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
  <header class="site"><div class="wrap"><a class="brand" href="/">Want<em>Watcher</em></a></div></header>
  <main><div class="wrap" id="app">
    <p class="loading">Loading the find…</p>
  </div></main>
  <footer><div class="wrap">WantWatcher — collector alerts for better finds, not more noise. Verification means the model ID appeared in the listing and the price checked out — photos are not inspected automatically. Always confirm the details with the seller before paying.</div></footer>

<script>
(function () {
  "use strict";
  var FEED_URL = "https://raw.githubusercontent.com/navJ1/wantwatcher-feed/main/feed.json";
  var app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    var h = Math.round(m / 60);
    if (h < 48) return h + "h ago";
    return Math.round(h / 24) + "d ago";
  }
  function money(item) {
    try {
      return new Intl.NumberFormat("en-CA", { style: "currency", currency: item.currency || "CAD" }).format(item.price);
    } catch (e) { return "$" + item.price; }
  }
  function loadError() {
    app.innerHTML =
      '<a class="back" href="/#live-finds">&larr; All finds</a>' +
      '<div class="missing"><h1>Couldn\'t load this find.</h1>' +
      "<p>Check your connection and try again — the feed may be temporarily unreachable.</p>" +
      '<p><a class="btn btn-ghost" href="/#live-finds">See live finds</a></p></div>';
  }
  function missing() {
    app.innerHTML =
      '<a class="back" href="/#live-finds">&larr; All finds</a>' +
      '<div class="missing"><h1>This find has moved on.</h1>' +
      "<p>It may have sold, expired, or aged out of the feed. The watcher posts new finds as they verify.</p>" +
      '<p><a class="btn btn-ghost" href="/#live-finds">See live finds</a></p></div>';
  }

  var id = null;
  try { id = new URLSearchParams(window.location.search).get("id"); } catch (e) {}
  if (!id) { missing(); return; }

  fetch(FEED_URL + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("feed " + r.status); return r.json(); })
    .then(function (data) {
      var items = (data && data.items) || [];
      var item = null;
      for (var i = 0; i < items.length; i++) {
        if (String(items[i].id) === String(id)) { item = items[i]; break; }
      }
      if (!item) { missing(); return; }

      var badge = item.badge === "verified"
        ? '<span class="badge verified">Verified find</span>'
        : '<span class="badge price_alert">Price alert</span>';
      var img = item.image
        ? '<img class="hero" src="' + esc(item.image) + '" alt="' + esc(item.title) + '" loading="eager" onerror="this.remove()">'
        : "";
      var why = item.why || [];
      var whyHtml = why.length
        ? "<ul>" + why.map(function (w) { return "<li>" + esc(w) + "</li>"; }).join("") + "</ul>"
        : "<p>Flagged from the listing title and price only. Confirm the model with the seller and check shipping before buying.</p>";

      app.innerHTML =
        '<a class="back" href="/#live-finds">&larr; All finds</a>' +
        '<article class="card">' + img + '<div class="card-body">' +
        badge +
        "<h1>" + esc(item.title) + "</h1>" +
        '<div class="price-row"><span class="price">' + esc(money(item)) + "</span></div>" +
        '<p class="meta">' + esc(item.niche || "") + " · " + esc(item.marketplace || "") +
        (item.detected_at ? " · found " + esc(ago(item.detected_at)) : "") + "</p>" +
        '<div class="why"><h2>Why the watcher flagged it</h2>' + whyHtml + "</div>" +
        '<div class="caveats"><h2>Before you buy</h2><ul>' +
        "<li>Confirm the model and revision with the seller — titles can be wrong.</li>" +
        "<li>Ask for photos of serials, labels and the actual item working, if not shown.</li>" +
        "<li>Factor in shipping, taxes and any import fees before comparing prices.</li>" +
        "</ul></div>" +
        '<div class="actions">' +
        '<a class="btn btn-primary" href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer">View listing</a>' +
        '<a class="btn btn-ghost" href="/#live-finds">More finds</a>' +
        "</div></div></article>";
    })
    .catch(function () { loadError(); });
})();
</script>
</body>
</html>
