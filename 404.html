<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d7773'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M19.5 19.5L27 27' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
<title>Not found · WantWatcher</title>
<meta name="description" content="That page doesn't exist — but the live feed of verified collector finds does.">
<style>
  :root {
    color-scheme: light dark;
    --page: #f3f4ee; --surface: #ffffff;
    --ink: #132222; --muted: #526160; --line: #c8d0c8;
    --teal: #0d7773; --teal-deep: #0c3435; --teal-soft: #d6ebe6;
    --orange: #ef8f2e;
    --radius-lg: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0c1717; --surface: #142323;
      --ink: #f4f4ea; --muted: #b3c2bf; --line: #344948;
      --teal: #50c0b4; --teal-deep: #082e2f; --teal-soft: #173b3a;
      --orange: #f0a04e;
    }
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55; min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }
  header.site { padding: 22px 0; }
  header.site a.brand { font-weight: 800; font-size: 1.15rem; color: var(--ink); text-decoration: none; }
  header.site a.brand em { color: var(--teal); font-style: normal; }
  main { flex: 1; display: flex; align-items: center; padding: 40px 0 80px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 44px 36px; text-align: center; }
  .code { font-size: 4rem; font-weight: 800; color: var(--teal); line-height: 1; margin-bottom: 8px; }
  h1 { margin: 0 0 10px; font-size: 1.6rem; }
  p { color: var(--muted); }
  .btn { display: inline-block; margin-top: 14px; padding: 13px 30px; border-radius: 999px; background: var(--orange); color: #1d1408; font-weight: 700; text-decoration: none; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 36px; color: var(--muted); font-size: 0.9rem; text-align: center; }
</style>
</head>
<body>
  <header class="site"><div class="wrap"><a class="brand" href="/">Want<em>Watcher</em></a></div></header>
  <main><div class="wrap">
    <div class="card">
      <div class="code">404</div>
      <h1>This find slipped away.</h1>
      <p>The page you're looking for doesn't exist — but the watcher never stops scanning. Head back to the live feed for today's verified finds.</p>
      <a class="btn" href="/#live-finds">See live finds</a>
    </div>
  </div></main>
  <footer><div class="wrap">WantWatcher — collector alerts for better finds, not more noise.</div></footer>
</body>
</html>
