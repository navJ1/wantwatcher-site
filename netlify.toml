# WantWatcher site — Netlify config
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Scheduled trial expiry (runs daily). Remove the schedule if the
# function is not yet wired to a trial store.
[functions."expire-trials"]
  schedule = "@daily"

# Scheduled keyword-alert dispatcher (runs every 30 minutes). Reads new
# listings from Supabase, matches them against saved searches, and sends
# one Resend email per new match (dedupe via alerts_sent — see
# supabase/migrations/002_alerts.sql). No-op until SUPABASE_* and
# RESEND_API_KEY are set.
[functions."dispatch-alerts"]
  schedule = "*/30 * * * *"

# Listing fetcher / sweep (runs every 15 minutes). Loads enabled saved
# searches from Supabase and queries the eBay Browse API, upserting
# results into public.listings for the dispatcher to match. No-op until
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, EBAY_APP_ID, EBAY_CERT_ID set.
[functions."fetch-listings"]
  schedule = "*/15 * * * *"

# Netlify Forms handles the trial signup form (data-netlify="true").
# Submissions land in the Netlify dashboard; no extra config needed.

# Friendly URLs
[[redirects]]
  from = "/trial"
  to = "/#trial"
  status = 302

# NOTE 2026-09-24: the edge-function Basic Auth gate (gate.js) was removed.
# The owner enabled Netlify's built-in site password protection in the
# dashboard instead (Site settings -> Access control), which takes
# precedence. Keeping both would double-lock the site: the edge gate fails
# closed when SITE_PASSWORD is unset, blocking even correctly authenticated
# visitors. Single source of truth for privacy is now the Netlify dashboard.

[[headers]]
  for = "/find.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
